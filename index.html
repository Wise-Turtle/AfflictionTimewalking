<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affliction Timewalking</title>
<style>
:root{--bg:#f4efe4;--card:#fffaf0;--ink:#1d2433;--mute:#667086;--gold:#9a6a10;--line:#d9cfb8;--acc:#2b5aa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061529;--card:#0d2442;--ink:#e8edf6;--mute:#8fa2c0;--gold:#e5b94c;--line:#1e3a63;--acc:#6aa5ff}}
:root[data-theme="dark"]{--bg:#061529;--card:#0d2442;--ink:#e8edf6;--mute:#8fa2c0;--gold:#e5b94c;--line:#1e3a63;--acc:#6aa5ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
header{text-align:center;padding:48px 20px 24px}
h1{font-size:clamp(2rem,6vw,3.2rem);margin:0;color:var(--gold);letter-spacing:.03em}
.sub{color:var(--mute);margin:8px auto 0;max-width:560px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:24px 0 8px;padding:0 12px}
.tabs button{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);font-weight:bold}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 20px;text-align:center;min-width:110px}
.stat b{display:block;font-size:1.5rem;color:var(--gold)}
.stat span{font-size:.8rem;color:var(--mute)}
main{max-width:760px;margin:0 auto;padding:16px 16px 64px}
.era{margin:40px 0 12px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.era h2{margin:0;color:var(--gold);font-size:1.4rem}
.era small{color:var(--mute)}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:20px}
.tier{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
.tier::before{content:"";position:absolute;left:-29px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--bg)}
.tier.done::before{background:var(--gold)}
.tier h3{margin:0;font-size:1.1rem}
.bosses{color:var(--mute);font-size:.85rem;margin:2px 0 8px}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}
.meta div span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.empty{color:var(--mute);font-style:italic}
.note{margin-top:8px;font-size:.9rem}
.hint{max-width:640px;margin:0 auto;text-align:center;color:var(--mute);font-size:.85rem;padding:0 16px}
code{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.achs{max-width:760px;margin:28px auto 0;padding:0 16px}
.achs h2{color:var(--gold);font-size:1.4rem;margin:0 0 12px}
.achs h2 small{color:var(--mute);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;opacity:.5;font-size:.9rem}
.a.on{opacity:1;border-color:var(--gold)}
.a b{display:block;margin-bottom:2px}
.a small{display:block;color:var(--mute)}
.a em{display:block;margin-top:4px;color:var(--gold);font-size:.8rem}
.cc{font-weight:bold;filter:brightness(.6) saturate(1.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cc{filter:none}}
:root[data-theme="dark"] .cc{filter:none}
.a .big{display:block;font-size:1.05rem;margin:6px 0 2px;color:var(--ink)}
.a em a{color:inherit}
#awards{margin-bottom:8px}
.bt{margin-top:10px}
.bt summary{cursor:pointer;color:var(--gold);font-size:.9rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem;margin-top:8px}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:normal;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
#players{margin-bottom:8px}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pl h3{margin:8px 0 0;font-size:1rem}
</style>
</head>

let current = "redux", era = "all";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderAch(d){
  const has=id=>!!(d[id]&&d[id].kill);
  const tiers=ERAS.flatMap(e=>e.tiers);
  const got=tiers.filter(t=>has(t.id));
  let fast=null;
  for(let i=1;i<got.length;i++){const g=Math.round((new Date(d[got[i].id].kill)-new Date(d[got[i-1].id].kill))/864e5);if(!fast||g<fast.g)fast={g};}
  const nEra=ERAS.filter(e=>e.tiers.some(t=>has(t.id))).length;
  const A=[
    {i:'🔥',n:'Opening Night',d:'Clear Molten Core.',ok:has('mc'),x:has('mc')?'Cleared '+d.mc.kill:''},
    ...ERAS.map(e=>{const c=e.tiers.filter(t=>has(t.id)).length;return {i:'🏆',n:e.name+' Complete',d:'Record every tier in '+e.name+'.',ok:c===e.tiers.length,p:c+'/'+e.tiers.length}}),
    {i:'🌍',n:'Across the Ages',d:'Clear raids in all five expansions.',ok:nEra===ERAS.length,p:nEra+'/'+ERAS.length},
    {i:'⚔️',n:'Veteran',d:'Record 10 raid tiers.',ok:got.length>=10,p:got.length+'/10'},
    {i:'⚡',n:'Back to Back',d:'Clear two tiers within 30 days of each other.',ok:!!fast&&fast.g<=30,x:fast?'Fastest gap: '+fast.g+' days':''},
    {i:'👑',n:'Garrosh Down',d:'Clear Siege of Orgrimmar.',ok:has('soo'),x:has('soo')?'Cleared '+d.soo.kill:''},
  ];
  const n=A.filter(a=>a.ok).length;
  $('achs').innerHTML=`<h2>Achievements <small>${n}/${A.length}</small></h2><div class="grid">`+A.map(a=>`<div class="a ${a.ok?'on':''}"><b>${a.i} ${esc(a.n)}</b><small>${esc(a.d)}</small>${a.ok?(a.x?`<em>${esc(a.x)}</em>`:''):(a.p?`<em>Progress ${a.p}</em>`:'')}</div>`).join('')+'</div>';
}

function bossTable(id){
  const rows=BOSSES[id]; if(!rows||!rows.length) return "";
  const f=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  return `<details class="bt"><summary>Boss breakdown (${rows.length})</summary><div class="tw"><table><tr><th>Boss</th><th>Mode</th><th>Kills</th><th>Wipes</th><th>First kill</th><th>Fastest</th></tr>`+rows.map(b=>`<tr><td>${esc(b[0])}</td><td>${esc(b[1])}</td><td>${b[2]}</td><td>${b[3]}</td><td>${b[4]}</td><td>${f(b[5])}</td></tr>`).join("")+`</table></div></details>`;
}
function renderAttend(){
  const A=ATTEND[era], T=[["Most raids attended","raids"],["Longest weekly streak","streak"]];
  $("attend").innerHTML=`<h2>Attendance <small>${era==="all"?"all expansions":esc(ERAS[era].name)}</small></h2><div class="pl">`+T.map(([t,k])=>`<div class="tw"><h3>${t}</h3><table><tr><th>#</th><th>Player</th><th>Spec</th><th>Raids</th><th>Streak (wks)</th></tr>`+A[k].map((p,i)=>`<tr><td>${i+1}</td><td>${cc(p[0],p[1])}${p[4]>1?` <small>+${p[4]-1} alt${p[4]>2?"s":""}</small>`:""}</td><td>${cc(p[1],p[1])}</td><td>${p[2]}</td><td>${p[3]}</td></tr>`).join("")+`</table></div>`).join("")+`</div><p class="hint" style="margin-top:8px">Characters are combined by player using the guild’s alt list, so a night counts once however many characters were played. A raid is a distinct night with a recorded parse. A streak is consecutive calendar weeks (Monday to Sunday) with at least one raid. <a href="https://github.com/Wise-Turtle/AfflictionTimewalking/Affliction%20Redux_%20Full%20Attendance.html" target="_blank" rel="noopener" style="color:var(--gold)">View the full attendance list</a>.</p>`;
}
function renderAwards(){
  const A=AWARDS[era], m=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  const link=(a,t)=>`<a href="https://classic.warcraftlogs.com/reports/${a[3]}#fight=${a[4]}" target="_blank" rel="noopener">${t}</a>`;
  const K=[
    ["🎁","Loot Pinata","Most killed boss",A.pinata[0],A.pinata[1].toLocaleString()+" kills"],
    ["💀","Guild Nemesis","Most wiped boss",A.nemesis[0],A.nemesis[1].toLocaleString()+" wipes ("+A.nemesis[2].toLocaleString()+" kills)"],
    ["⚡","Quickie","Fastest boss kill",A.quickie[0],link(A.quickie,m(A.quickie[1]))+" on "+A.quickie[2]],
    ["😴","I’m Tired","Slowest boss kill",A.tired[0],link(A.tired,m(A.tired[1]))+" on "+A.tired[2]]
  ];
  $("awards").innerHTML=`<h2>Hall of Fame <small>${era==="all"?"all expansions":esc(ERAS[era].name)}</small></h2><div class="grid">`+K.map(c=>`<div class="a on"><b>${c[0]} ${c[1]}</b><small>${c[2]}</small><span class="big">${esc(c[3])}</span><em>${c[4]}</em></div>`).join("")+`</div>`;
}
const CLS={deathknight:"#C41E3A",druid:"#FF7C0A",hunter:"#AAD372",mage:"#3FC7EB",monk:"#00FF98",paladin:"#F48CBA",priest:"#FFFFFF",rogue:"#FFF468",shaman:"#0070DD",warlock:"#8788EE",warrior:"#C69B6D"};
function cc(t,s){const c=CLS[String(s).split(" ").pop().toLowerCase()]||"";return `<span class="cc"${c?` style="color:${c}"`:""}>${esc(t)}</span>`}
function renderPlayers(){
  const L={dps:"DPS",healers:"Healers",tanks:"Tanks"}, P=PLAYERS[era];
  const sub=era==="all"?"all expansions":ERAS[era].name;
  $("players").innerHTML=`<h2>Top performers <small>${esc(sub)} · most parses of 95 or higher</small></h2><div class="pl">`+Object.keys(L).map(k=>`<div class="tw"><h3>${L[k]}</h3><table><tr><th>#</th><th>Player</th><th>Spec</th><th>95+</th><th>Avg</th></tr>`+(P[k].length?P[k].map((p,i)=>`<tr><td>${i+1}</td><td>${cc(p[0],p[1])}</td><td>${cc(p[1],p[1])}</td><td>${p[2]}</td><td>${p[3]}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">No data</td></tr>`)+`</table></div>`).join("")+`</div>`;
}

function render(){
  $("tabs").innerHTML = Object.entries(GUILDS).map(([k,g]) =>
    `<button data-k="${k}" aria-pressed="${k===current}">${esc(g.name)} · ${esc(g.realm)}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { current = b.dataset.k; render(); });
  $("eras").innerHTML = [["all","All expansions"]].concat(ERAS.map((e,i)=>[String(i),e.name])).map(([k,n]) =>
    `<button data-e="${k}" aria-pressed="${String(era)===k}">${esc(n)}</button>`).join("");
  $("eras").querySelectorAll("button").forEach(b => b.onclick = () => { era = b.dataset.e==="all" ? "all" : +b.dataset.e; render(); });

  const g = GUILDS[current], d = g.data;
  const scope = era==="all" ? ERAS : [ERAS[era]];
  const ts = scope.flatMap(e => e.tiers);
  const got = ts.filter(t => d[t.id] && d[t.id].kill);
  const dates = got.map(t => d[t.id].kill).sort();
  const X = STATS[era], N = v => v.toLocaleString();
  const S = (v,l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  $("stats").innerHTML = S(got.length+"/"+ts.length,"tiers recorded") + S(dates[0]||"—","first kill") +
    S(dates.length?dates[dates.length-1]:"—","latest tier cleared") + S(N(X.k),"boss kills") +
    S(N(X.w),"wipes") + S(N(X.p),"pulls") + S(N(X.r),"unique raiders") + S(N(Math.round(X.h))+" h","in boss fights");

  $("achs").style.display = era==="all" ? "" : "none";
  renderAwards();
  renderAch(d);
  renderPlayers();
  renderAttend();
  $("main").innerHTML = scope.map(e => `
    <div class="era"><h2>${esc(e.name)}</h2><small>${esc(e.years)}</small></div>
    <div class="tl">${e.tiers.map(t => {
      const r = d[t.id] || {};
      return `<div class="tier ${r.kill ? "done" : ""}">
        <h3>${esc(t.t)}</h3><div class="bosses">${esc(t.b)}</div>
        ${r.kill
          ? `<div class="meta"><div><span>Cleared</span>${esc(r.kill || "—")}</div></div>`
          : `<div class="empty">No results added yet.</div>`}
        ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}${bossTable(t.id)}
      </div>`;}).join("")}</div>`).join("");
}
render();
</script>
</body>
</html>
